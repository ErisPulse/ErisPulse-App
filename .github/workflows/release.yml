name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.2.0），留空则从 pubspec.yaml 读取"
        required: false
      force_rootfs:
        description: "强制重建 rootfs（忽略已有资产）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # 代码质量检查（独立 job，失败不影响后续构建任务的独立性）
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/ test/
      - run: flutter analyze
      - run: flutter test

  # rootfs：构建或复用（该版本已有则跳过）
  build-rootfs:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Setup QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            V=$(grep '^version' pubspec.yaml | head -1 | sed 's/version: *//;s/+.*//')
            echo "version=$V" >> $GITHUB_OUTPUT
          fi

      - name: Check rootfs in release
        id: rootfs
        run: |
          if [ "${{ github.event.inputs.force_rootfs }}" == "true" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "force_rootfs=true, 强制重建"
            exit 0
          fi
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null \
            | grep -q "rootfs-aarch64.tar.gz"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build rootfs image (arm64)
        if: steps.rootfs.outputs.exists == 'false'
        run: |
          docker buildx build --platform linux/arm64 --load \
            -t erispulse-rootfs:build -f scripts/Dockerfile.rootfs .

      - name: Export rootfs + extract runtime binaries
        if: steps.rootfs.outputs.exists == 'false'
        run: |
          docker create --platform linux/arm64 --name rootfs-build erispulse-rootfs:build
          docker export rootfs-build -o rootfs.tar
          mkdir -p /tmp/extract
          tar -xf rootfs.tar -C /tmp/extract \
            proot-aarch64 busybox-aarch64 loader-aarch64 \
            libtalloc.so.2-aarch64 libandroid-shmem.so-aarch64
          mkdir -p /tmp/clean
          tar -xf rootfs.tar -C /tmp/clean \
            --exclude=proot-aarch64 --exclude=busybox-aarch64 \
            --exclude=loader-aarch64 --exclude=libtalloc.so.2-aarch64 \
            --exclude=libandroid-shmem.so-aarch64 \
            --exclude=build-rootfs.sh
          tar -cf - -C /tmp/clean . | gzip -9 > rootfs.tar.gz
          docker rm rootfs-build
          cp /tmp/extract/proot-aarch64 proot-aarch64
          cp /tmp/extract/busybox-aarch64 busybox-aarch64
          cp /tmp/extract/loader-aarch64 loader-aarch64
          cp /tmp/extract/libtalloc.so.2-aarch64 libtalloc.so.2-aarch64
          cp /tmp/extract/libandroid-shmem.so-aarch64 libandroid-shmem.so-aarch64
          rm -rf /tmp/extract /tmp/clean rootfs.tar

      - name: Download existing rootfs assets
        if: steps.rootfs.outputs.exists == 'true'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release download "$TAG" -R ${{ github.repository }} --clobber \
            -p "*-rootfs-aarch64.tar.gz" -p "*-proot-aarch64" -p "*-busybox-aarch64" \
            -p "*-loader-aarch64" -p "*-libtalloc.so.2-aarch64" \
            -p "*-libandroid-shmem.so-aarch64"
          mv *-rootfs-aarch64.tar.gz rootfs.tar.gz
          mv *-proot-aarch64 proot-aarch64
          mv *-busybox-aarch64 busybox-aarch64
          mv *-loader-aarch64 loader-aarch64
          mv *-libtalloc.so.2-aarch64 libtalloc.so.2-aarch64
          mv *-libandroid-shmem.so-aarch64 libandroid-shmem.so-aarch64

      - name: Upload runtime assets
        uses: actions/upload-artifact@v4
        with:
          name: runtime-assets
          path: |
            rootfs.tar.gz
            proot-aarch64
            busybox-aarch64
            loader-aarch64
            libtalloc.so.2-aarch64
            libandroid-shmem.so-aarch64
          retention-days: 7

  # APK：online 不内置 rootfs，offline 内置 rootfs（矩阵并行，各自可独立重试）
  build-apk:
    needs: [verify, build-rootfs]
    runs-on: ubuntu-latest
    env:
      # 正式签名（keystore 与口令来自 CI secrets，保证 online/offline 同签名，可覆盖升级）
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        flavor: [online, offline]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Download runtime assets
        uses: actions/download-artifact@v4
        with:
          name: runtime-assets
          path: runtime/

      - name: Stage runtime binaries (jniLibs)
        run: |
          # proot/busybox/loader/talloc/libandroid-shmem 作为 native lib 打包进 APK（jniLibs）：
          # 只有 native lib 目录（apk_data_file，useLegacyPackaging 提取后）
          # 允许 untrusted_app 直接执行（execute_no_trans）。
          # assets 里的文件落在 app 私有目录（app_data_file），无法 exec。
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp runtime/proot-aarch64            android/app/src/main/jniLibs/arm64-v8a/libproot.so
          cp runtime/busybox-aarch64          android/app/src/main/jniLibs/arm64-v8a/libbusybox.so
          cp runtime/loader-aarch64           android/app/src/main/jniLibs/arm64-v8a/libloader.so
          cp runtime/libtalloc.so.2-aarch64   android/app/src/main/jniLibs/arm64-v8a/liblibtalloc.so.2.so
          cp runtime/libandroid-shmem.so-aarch64 android/app/src/main/jniLibs/arm64-v8a/libandroid-shmem.so
          chmod +x android/app/src/main/jniLibs/arm64-v8a/*.so

      - name: Stage rootfs (offline only)
        if: matrix.flavor == 'offline'
        run: |
          cp runtime/rootfs.tar.gz assets/rootfs/erispulse-rootfs-aarch64.tar.gz

      - name: Install deps
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APKs
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --split-per-abi --dart-define=FLAVOR=${{ matrix.flavor }}
          flutter build apk --release --dart-define=FLAVOR=${{ matrix.flavor }}

      - name: Rename APKs (arm64-v8a + universal only)
        run: |
          mkdir -p out
          V=$(grep '^version' pubspec.yaml | head -1 | sed 's/version: *//;s/+.*//')
          F="${{ matrix.flavor }}"
          SRC="build/app/outputs/flutter-apk"
          # 仅 arm64-v8a / universal：runtime 二进制（proot/busybox）只有 arm64 构建，
          # armeabi-v7a / x86_64 APK 不含 native lib 无法运行
          cp "$SRC/app-arm64-v8a-release.apk" "out/ErisPulse-App-${V}-${F}-arm64-v8a.apk"
          cp "$SRC/app-release.apk"           "out/ErisPulse-App-${V}-${F}-universal.apk"
          ls -lh out/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}
          path: out/*.apk
          retention-days: 7

  # 桌面端（Windows / Linux / macOS，x64 + arm64）：构建时注入内置 Python
  #（python-build-standalone，见 desktop_sdk.dart；产物名与打包路径按 build_arch）
  desktop-build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_arch: windows-x64
            build_arch: x64
            triple: x86_64-pc-windows-msvc
          - os: windows-11-arm
            platform_arch: windows-arm64
            build_arch: arm64
            triple: aarch64-pc-windows-msvc
            flutter_manual: true
          - os: ubuntu-latest
            platform_arch: linux-x64
            build_arch: x64
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform_arch: linux-arm64
            build_arch: arm64
            triple: aarch64-unknown-linux-gnu
            flutter_manual: true
          - os: macos-latest
            platform_arch: macos-arm64
            build_arch: arm64
            triple: aarch64-apple-darwin
          - os: macos-13
            platform_arch: macos-x64
            build_arch: x64
            triple: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        if: ${{ !matrix.flutter_manual }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      # Flutter 官方 Linux/Windows 只发布 x64 SDK 存档（无独立 arm64 存档），
      # subosito/flutter-action 无法为 arm64 解析版本。改用官方 x64 存档
      # 手动解压：flutter 脚本会按宿主架构（aarch64）自动下载 Dart SDK 与引擎。
      - name: Setup Flutter (arm64 手动下载)
        if: ${{ matrix.flutter_manual }}
        shell: pwsh
        run: |
          $V = "3.44.8"
          $dest = Join-Path $env:RUNNER_TEMP "flutter"
          if ($IsLinux) {
            $url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${V}-stable.tar.xz"
            $file = Join-Path $env:RUNNER_TEMP "flutter.tar.xz"
            Invoke-WebRequest -Uri $url -OutFile $file
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            tar -xf $file -C $dest
          } else {
            $url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_${V}-stable.zip"
            $file = Join-Path $env:RUNNER_TEMP "flutter.zip"
            Invoke-WebRequest -Uri $url -OutFile $file
            Expand-Archive -Path $file -DestinationPath $dest -Force
          }
          $binDir = "$dest\flutter\bin"
          Write-Output $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8
          $env:PATH = "$binDir;$env:PATH"
          flutter --version

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev \
            libjsoncpp-dev libwebkit2gtk-4.1-dev

      - name: Install deps
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Determine version
        id: version
        shell: bash
        run: |
          V=$(grep '^version' pubspec.yaml | head -1 | sed 's/version: *//;s/+.*//')
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: Fetch bundled Python (python-build-standalone)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TRIPLE="${{ matrix.triple }}"
          RESP=$(curl -sL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/astral-sh/python-build-standalone/releases/latest")
          echo "$RESP" | jq -e '.assets | type == "array"' >/dev/null 2>&1 || {
            echo "::error::GitHub API 响应异常"
            echo "$RESP" | head -c 500
            exit 1
          }
          ASSET=$(echo "$RESP" | jq -r --arg t "$TRIPLE" \
            '[.assets[] | select(.name | test("cpython-3\\.15\\..*" + $t + ".*install_only\\.tar\\.gz$"))][0].browser_download_url')
          if [ -z "$ASSET" ] || [ "$ASSET" = "null" ]; then
            echo "::error::No bundled Python asset for ${{ matrix.platform_arch }} ($TRIPLE)"
            exit 1
          fi
          echo "Downloading $ASSET"
          mkdir -p assets/python
          curl -sL "$ASSET" -o "assets/python/python-${{ matrix.platform_arch }}.tar.gz"
          ls -lh assets/python/

      - name: Setup NuGet (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # flutter_inappwebview_windows 需要 nuget 下载 WebView2 SDK 依赖
          if (-not (Get-Command nuget -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile "$env:RUNNER_TOOL_CACHE\nuget.exe"
            Write-Output "$env:RUNNER_TOOL_CACHE" >> $env:GITHUB_PATH
          }

      - name: Build Windows
        if: runner.os == 'Windows'
        run: flutter build windows --release

      - name: Build Linux
        if: runner.os == 'Linux'
        run: flutter build linux --release

      - name: Build macOS (unsigned)
        if: runner.os == 'macOS'
        run: flutter build macos --release

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $V = "${{ steps.version.outputs.version }}"
          $Arch = "${{ matrix.build_arch }}"
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Compress-Archive -Path "build/windows/$Arch/runner/Release/*" `
            -DestinationPath "out/ErisPulse-App-$V-windows-$Arch.zip"

      - name: Ensure Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $V = "${{ steps.version.outputs.version }}"
          $Arch = "${{ matrix.build_arch }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DVersion=$V" "/DArch=$Arch" windows-installer.iss

      - name: Verify bundled Python asset
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            DIR="build/windows/${{ matrix.build_arch }}/runner/Release/data/flutter_assets/assets/python"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            DIR="build/linux/${{ matrix.build_arch }}/release/bundle/data/flutter_assets/assets/python"
          else
            DIR="build/macos/Build/Products/Release/erispulse_app.app/Contents/Frameworks/App.framework/Resources/flutter_assets/assets/python"
          fi
          ls -lh "$DIR" || { echo "::error::bundled Python 未进入 flutter_assets ($DIR)"; exit 1; }

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          V="${{ steps.version.outputs.version }}"
          mkdir -p out
          tar -czf "out/ErisPulse-App-${V}-linux-${{ matrix.build_arch }}.tar.gz" \
            -C build/linux/${{ matrix.build_arch }}/release/bundle .

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          V="${{ steps.version.outputs.version }}"
          mkdir -p out
          # macOS app 名来自 AppInfo.xcconfig 的 PRODUCT_NAME（erispulse_app）
          ditto -c -k --keepParent \
            "build/macos/Build/Products/Release/erispulse_app.app" \
            "out/ErisPulse-App-${V}-macos-${{ matrix.build_arch }}.zip"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform_arch }}
          path: out/
          retention-days: 7

  # Release：收集全部产物，创建 / 更新 v{version}
  release:
    needs: [build-apk, desktop-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            V=$(grep '^version' pubspec.yaml | head -1 | sed 's/version: *//;s/+.*//')
            echo "version=$V" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect release assets
        run: |
          mkdir -p out
          V="${{ steps.version.outputs.version }}"
          # APK（来自 build-apk 矩阵）
          cp artifacts/apk-online/*.apk out/ 2>/dev/null || true
          cp artifacts/apk-offline/*.apk out/ 2>/dev/null || true
          # 桌面端（来自 desktop-build 矩阵，desktop-{platform_arch}）
          cp artifacts/desktop-*/* out/ 2>/dev/null || true
          # rootfs + 二进制（来自 build-rootfs）
          # rootfs 使用固定资产名：App 端通过 releases/latest/download/erispulse-rootfs-aarch64.tar.gz 下载
          cp artifacts/runtime-assets/rootfs.tar.gz              "out/erispulse-rootfs-aarch64.tar.gz"
          cp artifacts/runtime-assets/proot-aarch64              "out/ErisPulse-App-${V}-proot-aarch64"
          cp artifacts/runtime-assets/busybox-aarch64            "out/ErisPulse-App-${V}-busybox-aarch64"
          cp artifacts/runtime-assets/loader-aarch64             "out/ErisPulse-App-${V}-loader-aarch64"
          cp artifacts/runtime-assets/libtalloc.so.2-aarch64     "out/ErisPulse-App-${V}-libtalloc.so.2-aarch64"
          cp artifacts/runtime-assets/libandroid-shmem.so-aarch64 "out/ErisPulse-App-${V}-libandroid-shmem.so-aarch64"
          ls -lh out/

      - name: Create / update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          TAG="v$V"
          NOTES=$(sed -n "/^## \[$V\] -/,/^## \[/p" CHANGELOG.md | sed '$d' | tail -n +2)

          if gh release view "$TAG" &>/dev/null; then
            gh release edit "$TAG" --notes "$NOTES" --title "ErisPulse-App $TAG"
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "ErisPulse-App $TAG" --notes "$NOTES"
          fi
